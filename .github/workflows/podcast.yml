name: Fabriquer l'épisode

on:
  push:
    branches: [main]
    paths: ["episodes/**.json"]
  workflow_dispatch:
    inputs:
      date:
        description: "Refabriquer un épisode précis (AAAA-MM-JJ), vide = épisodes manquants"
        required: false

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests pyyaml

      - name: Synthèse vocale et assemblage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python scripts/build_episode.py ${{ github.event.inputs.date }}

      - name: Publier l'épisode et le flux
        run: |
          git config user.name "revue-du-matin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "Épisode $(date -u +%F)"
          git pull --rebase
          git push
