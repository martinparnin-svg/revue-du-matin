name: Épisode d'essai (hors flux)

# Fabrique un épisode à partir d'un script de episodes-test/ et le publie dans docs/tests/,
# sans toucher au flux podcast ni aux épisodes quotidiens.

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Script d'essai (chemin dans le dépôt)"
        required: true
        default: "episodes-test/2026-10-13-trois-voix.json"

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests pyyaml
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_episode.py --test "${{ github.event.inputs.file }}"
      - run: |
          git config user.name "revue-du-matin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/tests
          git commit -m "Épisode d'essai" || exit 0
          git pull --rebase
          git push
