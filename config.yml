# Réglages de la Revue du matin
# Modifier ce fichier suffit pour changer de voix ou de service.

show:
  title: "Revue du matin"
  author: "Revue du matin"
  description: "Un quart d'heure chaque matin de semaine pour faire le tour de l'actualité et comprendre les sujets qui comptent : international, politique française, social, environnement, économie, industrie et IA, pour préparer les concours de la haute fonction publique."
  language: "fr"
  # Adresse publique du site GitHub Pages (remplie lors de l'installation)
  base_url: "https://martinparnin-svg.github.io/revue-du-matin"
  keep_episodes: 90   # deux épisodes par jour (revue + flash)

voice:
  # Service de synthèse : mistral | gemini | elevenlabs | google_chirp
  # Mistral depuis le 16 novembre 2026 (crédit Gemini épuisé). Retour arrière : provider: gemini
  provider: mistral

  mistral:
    model: "voxtral-mini-tts-3"
    max_chars: 2500
    pause_between_calls_s: 1
    # Voix du script -> voix Mistral. Léa : voix principale (matin, animatrice du soir) ; Marie : experte du soir.
    voices:
      default: Lea
      Lea: Lea
      Marie: Marie
      Algieba: Lea
      Gacrux: Marie
      Kore: Marie
      Charon: Harriet      # passages en anglais
      Harriet: Harriet
    ids:
      Lea: "01a151d2-8c29-766d-9ca2-30f33707cef6"
      Marie: "01a1536e-a46c-7101-b6e9-1ebda46309fd"
      Harriet: "01a14675-dbde-703e-bddf-b373f6bf3872"

  gemini:
    model: "gemini-3.8-flash-tts"
    voice: "Algieba"          # voix choisie ; autres essais : Sulafat, Achird, Charon, Gacrux
    style: "warm, clear morning radio host, natural and engaging pace"
    pause_between_calls_s: 4  # pour rester sous les limites du quota gratuit

  elevenlabs:
    model: "eleven_multilingual_v2"
    voice_id: ""              # à remplir si l'on bascule sur ElevenLabs

  google_chirp:
    voice: "fr-FR-Chirp3-HD-Charon"

audio:
  pause_between_paragraphs_ms: 450
  pause_after_chapter_title_ms: 300
  target_lufs: -16
  bitrate: "96k"
